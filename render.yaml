services:
  - type: web
    name: iron-dominion-relay
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run multiplayer
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RECONNECT_GRACE_MS
        value: '180000'
      - key: MAX_COMMANDS_PER_SECOND
        value: '180'
      # off | log | enforce — see server/memberAuth.mjs. Starts in log so the
      # pass rate can be read before membership can refuse anyone.
      - key: MEMBER_AUTH
        value: log
      # Same value the Worker signs enlistment tickets with. Without it the relay
      # reports every check as unavailable, which never refuses anyone.
      - key: IRON_DOMINION_INGEST_SECRET
        sync: false
