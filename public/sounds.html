<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Iron Dominion · Sound library</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080b0d; color: #ecf1ed; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    body {
      padding: clamp(16px, 4vw, 56px);
      background:
        radial-gradient(circle at 78% 8%, rgba(161, 58, 34, 0.2), transparent 28%),
        linear-gradient(145deg, #101719, #080a0b 65%);
    }
    main {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: clamp(18px, 3vw, 36px);
      border: 1px solid #52605c;
      border-radius: 4px;
      background: rgba(14, 20, 20, 0.96);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.46), inset 0 0 0 4px rgba(7, 10, 10, 0.72);
    }
    .eyebrow { margin-bottom: 9px; color: #df654b; font-size: 11px; font-weight: 800; letter-spacing: 0.16em; }
    h1 { margin: 0; font: 800 clamp(25px, 4vw, 44px)/1.05 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: 0.035em; text-transform: uppercase; }
    header p { max-width: 780px; margin: 12px 0 0; color: #9fa9a5; font-size: 13px; line-height: 1.55; }
    code { color: #d7e4dc; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 22px 0 8px; }
    input[type="search"] {
      flex: 1 1 280px; min-width: 200px; height: 38px; padding: 0 12px;
      border: 1px solid #60706b; border-radius: 4px; background: #12191a; color: #f2f5f1;
      font: 13px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    button {
      height: 38px; padding: 0 14px; border: 1px solid #60706b; border-radius: 4px;
      color: #f2f5f1; background: #1a2424; font: 800 11px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
    }
    button:hover, button:focus-visible { border-color: #df654b; color: #fff; }
    button.is-playing { background: #3a211c; border-color: #df654b; }
    .status { margin: 0 0 22px; color: #8d9994; font-size: 12px; }
    .group { margin: 0 0 28px; padding-top: 18px; border-top: 1px solid #343f3c; }
    .group h2 { margin: 0 0 4px; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
    .group .count { color: #8d9994; font-size: 11px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-top: 12px; }
    .card {
      display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start;
      padding: 12px; border: 1px solid #3d4a46; border-radius: 4px; background: #101617;
    }
    .card h3 { margin: 0 0 4px; font-size: 13px; font-weight: 800; }
    .card p { margin: 0 0 8px; color: #8d9994; font-size: 11px; line-height: 1.4; min-height: 1.4em; }
    .file { display: block; color: #c9b48a; font-size: 11px; word-break: break-all; cursor: pointer; }
    .file:hover { color: #f0d9a4; }
    .hidden { display: none; }
  </style>
</head>

        on disk with the <strong>same filename</strong> and press Play again. The player bypasses cache so the new take is heard immediately.
        The in-game mixer is still at <code>?sfx-preview=all</code>.
      </p>
    </header>
    <div class="toolbar">
      <input id="filter" type="search" placeholder="Filter by name, file, or folder" />
      <button id="stop" type="button">Stop all</button>
    </div>
    <p class="status" id="status"></p>
    <div id="groups"></div>
  </main>

    const groupsEl = document.getElementById('groups');
    const filterEl = document.getElementById('filter');
    const statusEl = document.getElementById('status');
    const players = new Map();
    let current = null;

    function stopAll() {
      for (const audio of players.values()) {
        audio.pause();
        audio.currentTime = 0;
      }
      current = null;
      for (const button of document.querySelectorAll('[data-play]')) {
        button.classList.remove('is-playing');
        button.textContent = 'Play';
      }
    }

    function play(sound, button) {
      const already = current === sound.path && !players.get(sound.path)?.paused;
      stopAll();
      if (already) return;
      const audio = new Audio(sound.path + '?t=' + Date.now());
      audio.loop = sound.loop;
      players.set(sound.path, audio);
      current = sound.path;
      button.classList.add('is-playing');
      button.textContent = sound.loop ? 'Stop' : 'Playing';
      audio.addEventListener('ended', () => {
        if (current === sound.path) {
          button.classList.remove('is-playing');
          button.textContent = 'Play';
          current = null;
        }
      });
      audio.play().catch((error) => {
        button.classList.remove('is-playing');
        button.textContent = 'Play';
        statusEl.textContent = 'Could not play ' + sound.file + ' — ' + error.message;
      });
    }

    function copyPath(disk) {
      navigator.clipboard?.writeText(disk);
      statusEl.textContent = 'Copied path: ' + disk;
    }

    function render(query) {
      const q = query.trim().toLowerCase();
      const visible = SOUNDS.filter((sound) => {
        if (!q) return true;
        return [sound.label, sound.file, sound.role, sound.group, sound.disk].join(' ').toLowerCase().includes(q);
      });
      const groups = new Map();
      for (const sound of visible) {
        if (!groups.has(sound.group)) groups.set(sound.group, []);
        groups.get(sound.group).push(sound);
      }
      groupsEl.replaceChildren();
      for (const [title, items] of groups) {
        const section = document.createElement('section');
        section.className = 'group';
        section.innerHTML = '<h2>' + title + '</h2><div class="count">' + items.length + ' files</div><div class="grid"></div>';
        const grid = section.querySelector('.grid');
        for (const sound of items) {
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML =
            '<div>' +
              '<h3>' + sound.label + '</h3>' +
              '<p>' + (sound.role || (sound.loop ? 'Loop' : 'One-shot')) + '</p>' +
              '<span class="file" title="Copy disk path">' + sound.disk + '</span>' +
            '</div>' +
            '<button type="button" data-play>Play</button>';
          card.querySelector('.file').addEventListener('click', () => copyPath(sound.disk));
          card.querySelector('[data-play]').addEventListener('click', (event) => play(sound, event.currentTarget));
          grid.appendChild(card);
        }
        groupsEl.appendChild(section);
      }
      statusEl.textContent = visible.length + ' of ' + SOUNDS.length + ' saved sounds';
    }

    document.getElementById('stop').addEventListener('click', stopAll);
    filterEl.addEventListener('input', () => render(filterEl.value));
    render('');
  </script>
