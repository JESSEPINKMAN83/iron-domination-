<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Code Red — Israel vs Iran. A hybrid strategy war game where you command armies from above or fight alongside them in first-person mode." />
    <meta name="theme-color" content="#0a0d10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Code Red" />
    <meta property="og:title" content="Code Red — Israel vs Iran" />
    <meta property="og:description" content="Command a war from above. Then drop into the fight yourself. Play solo or online. No signup required." />
    <meta property="og:type" content="website" />
    <title>Code Red — Israel vs Iran</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #0a0d10;
      }
      /* Keep Windows native scrollbars inside their owning panels; hidden
         screens must never retain a composited scrollbar over the game. */
      html { color-scheme: dark; }
      [hidden] { display: none !important; }
      * { scrollbar-width: thin; scrollbar-color: #52685f #111a1c; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: #111a1c; }
      ::-webkit-scrollbar-thumb { background: #52685f; border: 2px solid #111a1c; border-radius: 8px; }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        outline: none;
      }
      #app > canvas {
        width: 100% !important;
        height: 100% !important;
      }
      html.mobile-touch-device.mobile-app-viewport #app {
        inset: auto;
        left: var(--mobile-app-left, 0px);
        top: var(--mobile-app-top, 0px);
        width: var(--mobile-app-width, 100dvw);
        height: var(--mobile-app-height, 100dvh);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
